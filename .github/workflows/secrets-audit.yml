name: secrets-audit

# Fail-closed, key-independent check that no plaintext secret can reach this
# repository. It intentionally installs no age identity and performs no
# decryption. The repository scanner validates tracked paths, approved SOPS
# dotenv structure, ciphertext-only payloads, and credential signatures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run key-independent tracked-secret policy
        run: npm run check:secrets
