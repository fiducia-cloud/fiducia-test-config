name: Immutable release evidence contract

on:
  pull_request:
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "schemas/release-evidence-contract-v1.schema.json"
      - "tools/verify_release_evidence.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-evidence-contract.yml"
      - "schemas/release-evidence-contract-v1.schema.json"
      - "tools/verify_release_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Parse the versioned schema
        run: python -m json.tool schemas/release-evidence-contract-v1.schema.json >/dev/null
      - name: Exercise tamper, mutability, skip, cleanup, and redaction gates
        run: python tools/verify_release_evidence.py --self-test
      - name: Compile the verifier
        run: python -m py_compile tools/verify_release_evidence.py
